```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudBox - My File Storage</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #0b0a10;
    color: white;
}

header {
    background: #15121f;
    padding: 20px;
    border-bottom: 1px solid #30243e;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #c084fc;
}

.container {
    padding: 30px;
}

h1 {
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

button {
    background: #9333ea;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #a855f7;
}

.stats {
    display: flex;
    gap: 20px;
    margin: 25px 0;
    flex-wrap: wrap;
}

.stat-box {
    background: #171420;
    border: 1px solid #30243e;
    border-radius: 12px;
    padding: 20px;
    flex: 1;
    min-width: 150px;
}

.stat-box h3 {
    color: #c084fc;
    margin-top: 10px;
}

.files {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.file {
    background: #171420;
    border: 1px solid #30243e;
    border-radius: 12px;
    padding: 18px;
    overflow-wrap: anywhere;
}

.file-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

.file-name {
    margin-bottom: 10px;
    font-weight: bold;
}

.file-size {
    color: #aaa;
    font-size: 13px;
}

.search {
    width: 100%;
    padding: 13px;
    margin: 20px 0;
    border: 1px solid #30243e;
    border-radius: 8px;
    background: #171420;
    color: white;
}

.empty {
    color: #aaa;
    padding: 30px;
    text-align: center;
}

.delete-btn {
    background: #be123c;
    margin-top: 12px;
}

.download-btn {
    margin-top: 12px;
}

footer {
    text-align: center;
    color: #777;
    padding: 25px;
}
</style>
</head>

<body>

<header>
    <div class="logo">☁ CloudBox</div>
    <div>My Personal Storage</div>
</header>

<div class="container">

    <h1>My Workspace</h1>
    <p class="subtitle">Your files, your space, your world.</p>

    <button onclick="document.getElementById('upload').click()">
        📤 Upload Files
    </button>

    <button onclick="createFolder()">
        📁 New Folder
    </button>

    <input type="file" id="upload" multiple hidden>

    <div class="stats">
        <div class="stat-box">
            Total Files
            <h3 id="totalFiles">0</h3>
        </div>

        <div class="stat-box">
            Storage Used
            <h3 id="storage">0 KB</h3>
        </div>

        <div class="stat-box">
            Status
            <h3>Offline Ready</h3>
        </div>
    </div>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="🔍 Search your files..."
        oninput="displayFiles()"
    >

    <h2>📂 My Files</h2>

    <div class="files" id="files">
        <div class="empty">No files uploaded yet.</div>
    </div>

</div>

<footer>
    CloudBox © 2026 | Personal File Storage
</footer>

<script>
let files = [];

const uploadInput = document.getElementById("upload");

uploadInput.addEventListener("change", function() {

    for (let file of this.files) {

        files.push(file);

    }

    displayFiles();

    this.value = "";

});

function displayFiles() {

    let container = document.getElementById("files");

    let search = document.getElementById("search").value.toLowerCase();

    container.innerHTML = "";

    let totalSize = 0;

    let count = 0;

    files.forEach((file, index) => {

        totalSize += file.size;

        if (!file.name.toLowerCase().includes(search)) {
            return;
        }

        count++;

        let div = document.createElement("div");

        div.className = "file";

        div.innerHTML = `
            <div class="file-icon">📄</div>

            <div class="file-name">${escapeHTML(file.name)}</div>

            <div class="file-size">${formatSize(file.size)}</div>

            <button class="download-btn">⬇ Download</button>

            <button class="delete-btn">🗑 Delete</button>
        `;

        div.querySelector(".download-btn").onclick = function() {
            downloadFile(file);
        };

        div.querySelector(".delete-btn").onclick = function() {
            files.splice(index, 1);
            displayFiles();
        };

        container.appendChild(div);

    });

    if (count === 0) {
        container.innerHTML = '<div class="empty">No files found.</div>';
    }

    document.getElementById("totalFiles").textContent = files.length;

    document.getElementById("storage").textContent = formatSize(totalSize);

}

function downloadFile(file) {

    let url = URL.createObjectURL(file);

    let a = document.createElement("a");

    a.href = url;

    a.download = file.name;

    a.click();

    URL.revokeObjectURL(url);

}

function formatSize(bytes) {

    if (bytes < 1024) return bytes + " B";

    if (bytes < 1048576)
        return (bytes / 1024).toFixed(2) + " KB";

    return (bytes / 1048576).toFixed(2) + " MB";

}

function createFolder() {

    let name = prompt("Enter folder name:");

    if (name) {
        alert("Folder '" + name + "' created! (Demo)");
    }

}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
</script>

</body>
</html>
