<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudBox - My Workspace</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #0b0715;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: 30px auto;
}

h1 {
  color: #b78aff;
  font-size: 35px;
}

.card {
  background: #191329;
  padding: 25px;
  margin: 20px 0;
  border-radius: 15px;
  border: 1px solid #38265b;
}

input {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #59417f;
  background: #0e0a19;
  color: white;
}

button {
  padding: 12px 18px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  background: #8748e8;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #a36aff;
}

#status {
  color: #c7a8ff;
  overflow-wrap: anywhere;
}

.file {
  padding: 12px;
  margin: 10px 0;
  background: #261b3b;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>☁ CloudBox</h1>
<p>My Workspace | Cloud Storage</p>

<div class="card">

<h2>Account</h2>

<input id="email" type="email"
placeholder="Enter your email">

<input id="password" type="password"
placeholder="Enter your password">

<button id="signup">Create Account</button>
<button id="login">Login</button>
<button id="logout">Logout</button>

<p id="status">Please create an account or log in.</p>

</div>

<div class="card">

<h2>Upload Files</h2>

<input type="file" id="fileInput">

<button id="upload">Upload File</button>

</div>

<div class="card">

<h2>My Files</h2>

<button id="refresh">Refresh Files</button>

<div id="fileList">
Your files will appear here.
</div>

</div>

</div>

<script type="module">

import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// SUPABASE CONNECTION

const SUPABASE_URL = 'YOUR_SUPABASE_URL';

const SUPABASE_KEY = 'YOUR_PUBLISHABLE_KEY';

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const BUCKET = 'cloudbox-files';

const status = document.getElementById('status');

const fileList = document.getElementById('fileList');


// GET CURRENT USER

async function getUser() {

  const { data, error } =
    await supabase.auth.getUser();

  if (error) return null;

  return data.user;
}


// CREATE ACCOUNT

document.getElementById('signup').onclick =
async function() {

  const email =
    document.getElementById('email').value;

  const password =
    document.getElementById('password').value;

  if (!email || !password) {
    status.textContent = 'Enter email and password.';
    return;
  }

  status.textContent = 'Creating account...';

  const { data, error } =
    await supabase.auth.signUp({
      email: email,
      password: password
    });

  if (error) {
    status.textContent = error.message;
    return;
  }

  if (data.session) {
    status.textContent = 'Account created and logged in!';
    loadFiles();
  } else {
    status.textContent =
      'Account created! Check your email for confirmation, then log in.';
  }

};


// LOGIN

document.getElementById('login').onclick =
async function() {

  const email =
    document.getElementById('email').value;

  const password =
    document.getElementById('password').value;

  if (!email || !password) {
    status.textContent = 'Enter email and password.';
    return;
  }

  status.textContent = 'Logging in...';

  const { error } =
    await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    status.textContent = error.message;
    return;
  }

  status.textContent = 'Login successful!';

  loadFiles();

};


// LOGOUT

document.getElementById('logout').onclick =
async function() {

  const { error } = await supabase.auth.signOut();

  if (error) {
    status.textContent = error.message;
    return;
  }

  fileList.textContent = 'Please log in.';

  status.textContent = 'Logged out.';

};


// UPLOAD FILE

document.getElementById('upload').onclick =
async function() {

  const user = await getUser();

  if (!user) {
    status.textContent = 'Please log in first.';
    return;
  }

  const file =
    document.getElementById('fileInput').files[0];

  if (!file) {
    status.textContent = 'Choose a file first.';
    return;
  }

  status.textContent = 'Uploading...';

  const path =
    user.id + '/' + Date.now() + '_' + file.name;

  const { error } = await supabase.storage
    .from(BUCKET)
    .upload(path, file);

  if (error) {
    status.textContent = error.message;
    return;
  }

  status.textContent = 'File uploaded successfully!';

  document.getElementById('fileInput').value = '';

  loadFiles();

};


// SHOW FILES

async function loadFiles() {

  const user = await getUser();

  if (!user) {
    fileList.textContent = 'Please log in first.';
    return;
  }

  fileList.textContent = 'Loading files...';

  const { data, error } = await supabase.storage
    .from(BUCKET)
    .list(user.id);

  if (error) {
    fileList.textContent = error.message;
    return;
  }

  fileList.replaceChildren();

  if (!data || data.length === 0) {
    fileList.textContent = 'No files uploaded yet.';
    return;
  }

  data.forEach(file => {

    const row = document.createElement('div');

    row.className = 'file';

    const name = document.createElement('span');

    name.textContent = file.name + ' ';

    const download = document.createElement('button');

    download.textContent = 'Download';

    download.onclick = async function() {

      const path = user.id + '/' + file.name;

      const { data, error } = await supabase.storage
        .from(BUCKET)
        .createSignedUrl(path, 60);

      if (error) {
        status.textContent = error.message;
        return;
      }

      window.open(data.signedUrl, '_blank');

    };

    row.append(name, download);

    fileList.append(row);

  });

}


// REFRESH FILES

document.getElementById('refresh').onclick =
function() {
  loadFiles();
};


// CHECK EXISTING LOGIN

supabase.auth.onAuthStateChange(
  (event, session) => {

    if (session) {
      status.textContent = 'Logged in!';
      loadFiles();
    } else {
      fileList.textContent = 'Please log in.';
    }

  }
);

</script>

</body>
</html>
